[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-suite"
version = "0.1.0"
description = "Frozen tool-agent task benchmarks with an Inspect Harness and DeepEval scoring"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eval-suite = "agent_eval_suite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
